<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Necessário para o layout responsivo funcionar no celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro | Meu Projeto</title>

  <!-- Fonte: DM Sans (troque pela fonte do seu projeto aqui e no cadastro.css) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="cadastro.css">
</head>
<body>

  <!-- Link para quem navega por teclado pular direto para o formulário -->
  <a class="pular-conteudo" href="#conteudo">Pular para o formulário</a>

  <!-- CABEÇALHO: logo + navegação principal -->
  <header class="topo">
    <a class="marca" href="index.html">
      <!-- Imagem com texto alternativo (troque pelo logo do seu projeto) -->
      <img
        src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f5c5c'/%3E%3Cpath d='M9 17l5 5 9-11' fill='none' stroke='%23ffd166' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
        alt="Logotipo do Meu Projeto"
        width="32" height="32">
      <span>Meu Projeto</span>
    </a>

 
  </header>

  <!-- CONTEÚDO PRINCIPAL (só existe um <main> por página) -->
  <main id="conteudo">
    <section class="cartao" aria-labelledby="titulo-cadastro">

      <!-- Hierarquia: título (h1) > texto de apoio > campos -->
      <h1 id="titulo-cadastro">Crie sua conta</h1>
      <p class="apoio">
        Leva menos de um minuto. Os campos marcados com
        <span class="obrigatorio" aria-hidden="true">*</span> são obrigatórios.
      </p>

      <form action="#" method="post">

        <!-- Grupo 1: dados pessoais -->
        <fieldset>
          <legend>Seus dados</legend>

          <div class="campo">
            <label for="nome">Nome completo <span class="obrigatorio" aria-hidden="true">*</span></label>
            <input type="text" id="nome" name="nome" autocomplete="name" required>
          </div>

          <div class="campo">
            <label for="email">E-mail <span class="obrigatorio" aria-hidden="true">*</span></label>
            <input type="email" id="email" name="email" autocomplete="email"
                   placeholder="nome@exemplo.com" required>
          </div>

          <div class="campo">
            <label for="telefone">Telefone com DDD <span class="obrigatorio" aria-hidden="true">*</span></label>
            <input type="tel" id="telefone" name="telefone" autocomplete="tel"
                   placeholder="(47) 99999-9999" required>
          </div>
        </fieldset>

        <!-- Grupo 2: localização -->
        <fieldset>
          <legend>Onde você mora</legend>

          <div class="campo">
            <label for="bairro">Bairro <span class="obrigatorio" aria-hidden="true">*</span></label>
            <input type="text" id="bairro" name="bairro" required>
          </div>

          <div class="campo">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" autocomplete="address-level2">
          </div>
        </fieldset>

        <!-- Aceite dos termos: checkbox com label ligado por for/id -->
        <div class="campo campo-check">
          <input type="checkbox" id="termos" name="termos" required>
          <label for="termos">
            Li e aceito os <a href="termos.html">termos de uso</a>
            <span class="obrigatorio" aria-hidden="true">*</span>
          </label>
        </div>

        <button type="submit" class="botao">Criar conta</button>
      </form>

      <p class="rodape-form">Já tem conta? <a href="login.html">Entrar</a></p>
    </section>
  </main>

</body>
</html>
